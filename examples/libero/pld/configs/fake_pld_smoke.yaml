env:
  _target_: vla_rl.envs.fake.FakeEnvBackend
  action_dim: 4
  proprio_dim: 5
  max_steps: 10
  image_shape: [16, 16, 3]
  seed: 0

policy:
  _target_: vla_rl.policies.fake.FakePolicyBackend
  action_dim: 4
  chunk_size: 2
  embedding_dim: 8
  seed: 1

pld_observation:
  _target_: vla_rl.algorithms.pld.PLDObservationBuilder
  image_keys: [front]
  action_dim: 4
  chunk_horizon: 1
  alpha: 0.5

algorithm:
  _target_: vla_rl.algorithms.pld.PLDSACAgent
  image_keys: [front]
  proprio_dim: 5
  action_dim: 4
  chunk_horizon: 1
  alpha: 0.5
  image_encoder_type: small
  image_feature_dim: 8
  vector_latent_dim: 6
  encoder_hidden_dim: 32
  actor_hidden_dims: [32]
  critic_hidden_dims: [32]
  critic_actor_ratio: 1
  utd_ratio: 1
  cql_n_actions: 2
  device: cpu

runtime:
  backend: agentlace
  role: learner
  trainer_ip: 127.0.0.1
  trainer_port: 5488
  broadcast_port: 5489
  store_name: actor_env
  actor_name: actor_env
  request_type: send-stats
  max_env_steps: 10
  max_update_steps: 10
  base_warmup_episodes: 0
  execute_horizon: 1
  batch_size: 1
  replay_capacity: 128
  replay_seed: 0
  gamma: 0.99
  training_starts: 1
  steps_per_update: 1
  log_period: 1
  checkpoint_period: 0
  actor_queue_capacity: 128
  resume_from: null
  run_dir: /tmp/vlarl_fake_pld_smoke
  offline_replay_path: null
  require_offline: false
  offline_ratio: 0.0
  offline_capacity: 128
  offline_max_episodes: null
  offline_max_transitions: null
  calql_pretrain_steps: 0
  calql_alpha: 1.0
  calql_n_actions: 2
  calql_temperature: 1.0
