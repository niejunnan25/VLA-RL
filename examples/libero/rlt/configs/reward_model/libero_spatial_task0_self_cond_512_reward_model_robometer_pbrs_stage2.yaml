env:
  _target_: vla_rl.envs.libero.LiberoLocalEnvBackend
  task_suite_name: libero_spatial
  task_id: 0
  action_dim: 7
  resolution: 256
  num_steps_wait: 10
  max_episode_steps: null
  benchmark_root: null
  libero_root: /vla/users/niejunnan/codebase/serl_torch/third_party/LIBERO
  libero_config_dir: null
  libero_datasets_root: /vla/users/niejunnan/datasets
  seed: 0
  image_size: 224

policy:
  _target_: vla_rl.policies.ReferencePolicyClient
  url: http://127.0.0.1:8899
  action_dim: 7
  timeout: 120.0
  retries: 3
  retry_sleep: 1.0

rlt:
  chunk_size: 5
  replan_steps: 5
  subsample_stride: 0
  max_tokens: 512

reward:
  type: env_plus_potential_delta
  source: remote_progress
  scale: 1.0
  initial_progress: query_start
  remote:
    url: http://127.0.0.1:50152
    method: predict_progress
    timeout: 120.0
    retries: 1
    retry_sleep: 0.5
  async:
    max_pending_chunks: 64
  trajectory:
    image_keys: [image_rgb_0, image_rgb_1]

feature:
  source: self_conditioned_prefix
  online_source: auto
  encoder_path: /vla/users/niejunnan/outputs/vlarl/rlt_stage1/libero_spatial_task0_self_conditioned_prefix_512/final_model.pt
  device: cuda
  input_dim: 2048
  rl_token_dim: 2048
  num_encoder_layers: 2
  num_heads: 8
  ff_dim: 2048
  dropout: 0.0

reference_action:
  policy_horizon: 10
  stride: 2

algorithm:
  _target_: vla_rl.algorithms.rlt.RLTAgent
  z_rl_dim: 2048
  proprio_dim: 8
  action_dim: 7
  chunk_size: 5
  actor_hidden_dims: [512, 512, 512]
  critic_hidden_dims: [512, 512, 512]
  actor_std: 0.01
  num_critics: 2
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  discount: 0.99
  tau: 0.005
  bc_reg_coeff: 4.0
  ref_dropout: 0.5
  clip_grad_norm: 10.0
  policy_update_freq: 2
  utd_ratio: 5
  device: cuda

runtime:
  trainer_ip: 127.0.0.1
  trainer_port: 5488
  broadcast_port: 5489
  store_name: actor_env
  actor_name: actor_env
  request_type: send-stats
  max_env_steps: 300000
  warmup_steps: 2500
  batch_size: 128
  replay_capacity: 100000
  replay_seed: 0
  gamma: 0.99
  training_starts: 128
  steps_per_update: 1
  log_period: 100
  checkpoint_period: 2000
  actor_queue_capacity: 2000
  resume_from: null
  run_dir: examples/libero/rlt/outputs/libero_spatial_robometer_pbrs_300k_s0/task00

wandb:
  project: vla-rl
  entity: null
  workspace: null
  group: null
  exp_name: libero_spatial_task0_robo-dopamine_pbrs
  tags: [libero, rlt, libero_spatial, robo-dopamine, pbrs]
  mode: online
  debug: false
  save_code: true
