[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-rl"
version = "0.0.1"
description = "Sample-efficient RL infrastructure for VLA policy post-training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "agentlace @ git+https://github.com/youliangtan/agentlace.git@cf2c337c5e3694cdbfc14831b239bd657bc4894d",
  "numpy>=1.24",
  "omegaconf>=2.3",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
pld = [
  "transformers>=4.40",
]
residual_sac = [
  "hydra-core>=1.3",
  "ml-collections>=0.1",
  "Pillow>=10.0",
  "opencv-python>=4.8",
  "requests>=2.31",
  "tqdm>=4.66",
  "gymnasium>=0.29",
  "gym>=0.23",
  "websockets>=12.0",
  "msgpack>=1.0",
  "transformers>=4.40",
]
wandb = [
  "swanlab>=0.7",
  "wandb>=0.16",
]

[tool.setuptools.packages.find]
include = ["vla_rl*", "residual_sac*"]
